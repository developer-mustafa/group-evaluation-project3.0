<!DOCTYPE html>
<html lang="bn" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্মার্ট ইভ্যালুয়েটর</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Bengali Font -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Hind Siliguri', 'SolaimanLipi', sans-serif;
        }
        
        /* Modal scroll lock */
        body.modal-open {
            overflow: hidden;
        }
        
        /* Smooth animations */
        .modal-enter {
            opacity: 0;
            transform: scale(0.9);
        }
        
        .modal-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.3s, transform 0.3s;
        }
        
        /* Developer info section styling */
        .developer-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .dark .developer-section {
            background: linear-gradient(135deg, #4c51bf 0%, #7e22ce 100%);
        }
        
        /* WhatsApp group button animation */
        .whatsapp-btn {
            background: linear-gradient(135deg, #25D366, #128C7E);
            transition: all 0.3s ease;
        }
        
        .whatsapp-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
        }
        
        /* Profile image styling */
        .profile-image {
            border: 4px solid white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .dark .profile-image {
            border-color: #374151;
        }
        
        /* Skill badges */
        .skill-badge {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* Responsive text sizes */
        @media (max-width: 640px) {
            .header-title {
                font-size: 1.1rem;
            }
            
            .header-buttons {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 min-h-screen transition-colors duration-300">
    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 bg-white dark:bg-gray-800 shadow-sm z-40 mobile-header flex items-center justify-between px-4 py-3">
        <!-- Mobile Menu Button -->
        <button id="mobileMenuButton" class="lg:hidden p-2 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
            <i class="fas fa-bars text-xl"></i>
        </button>
        
        <!-- App Title -->
        <div class="flex items-center space-x-2 md:space-x-3">
            <div class="w-8 h-8 bg-blue-500 rounded-lg flex items-center justify-center">
                <i class="fas fa-users text-white"></i>
            </div>
            <h1 class="header-title text-lg md:text-xl font-bold text-gray-800 dark:text-white">স্মার্ট ইভ্যালুয়েটর</h1>
        </div>
        
        <!-- User Actions -->
        <div class="flex items-center space-x-2 md:space-x-3">
            <!-- Developer Info Button -->
            <button id="developerInfoBtn" class="p-2 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" title="সফটওয়্যার নির্মাতা তথ্য">
                <i class="fas fa-code text-lg"></i>
            </button>
            
            <!-- WhatsApp Group Button -->
            <a href="https://chat.whatsapp.com/YOUR_GROUP_LINK" target="_blank" class="whatsapp-btn p-2 rounded-lg text-white flex items-center space-x-1 md:space-x-2 header-buttons">
                <i class="fab fa-whatsapp text-lg"></i>
                <span class="hidden sm:inline">গ্রুপ জয়েন</span>
            </a>
            
            <!-- Theme Toggle -->
            <button id="themeToggle" class="p-2 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                <i class="fas fa-moon text-lg"></i>
            </button>
            
            <!-- User Info / Login -->
            <div class="flex items-center space-x-2">
                <div id="userInfo" class="text-right hidden md:block">
                    <div class="text-xs text-gray-500 dark:text-gray-400">সাধারণ ব্যবহারকারী</div>
                </div>
                <button id="headerLoginBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 md:px-4 md:py-2 rounded-lg transition-colors flex items-center space-x-1 md:space-x-2 header-buttons">
                    <i class="fas fa-sign-in-alt"></i>
                    <span class="hidden sm:inline">লগইন</span>
                </button>
                <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 md:px-4 md:py-2 rounded-lg transition-colors flex items-center space-x-1 md:space-x-2 header-buttons hidden">
                    <i class="fas fa-sign-out-alt"></i>
                    <span class="hidden sm:inline">লগআউট</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="pt-16 min-h-screen">
        <!-- Your main app content goes here -->
        <div class="max-w-7xl mx-auto px-4 py-8">
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm p-6">
                <h2 class="text-2xl font-bold mb-4 text-gray-800 dark:text-white">ড্যাশবোর্ড</h2>
                <p class="text-gray-600 dark:text-gray-300">আপনার অ্যাপ্লিকেশনের মূল কন্টেন্ট এখানে থাকবে</p>
            </div>
        </div>
    </main>

  
    <script>
        class SmartEvaluatorUI {
            constructor() {
                this.init();
            }
            
            init() {
                this.setupEventListeners();
                this.applySavedTheme();
            }
            
            setupEventListeners() {
                // Theme Toggle
                document.getElementById('themeToggle').addEventListener('click', () => {
                    this.toggleTheme();
                });
                
                // Developer Modal
                document.getElementById('developerInfoBtn').addEventListener('click', () => {
                    this.openDeveloperModal();
                });
                
                document.getElementById('closeDeveloperModal').addEventListener('click', () => {
                    this.closeDeveloperModal();
                });
                
                // Close modal when clicking outside
                document.getElementById('developerModal').addEventListener('click', (e) => {
                    if (e.target.id === 'developerModal') {
                        this.closeDeveloperModal();
                    }
                });
                
                // Close modal with Escape key
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        this.closeDeveloperModal();
                    }
                });
                
                // Mobile Menu Button
                document.getElementById('mobileMenuButton').addEventListener('click', () => {
                    this.toggleMobileMenu();
                });
            }
            
            toggleTheme() {
                const isDark = document.documentElement.classList.contains('dark');
                const themeIcon = document.getElementById('themeToggle').querySelector('i');
                
                if (isDark) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                    themeIcon.className = 'fas fa-moon text-lg';
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                    themeIcon.className = 'fas fa-sun text-lg';
                }
            }
            
            applySavedTheme() {
                const savedTheme = localStorage.getItem('theme');
                const themeIcon = document.getElementById('themeToggle').querySelector('i');
                
                if (savedTheme === 'dark') {
                    document.documentElement.classList.add('dark');
                    themeIcon.className = 'fas fa-sun text-lg';
                } else {
                    document.documentElement.classList.remove('dark');
                    themeIcon.className = 'fas fa-moon text-lg';
                }
            }
            
            openDeveloperModal() {
                const modal = document.getElementById('developerModal');
                modal.classList.remove('hidden');
                document.body.classList.add('modal-open');
                
                // Add animation
                setTimeout(() => {
                    modal.classList.add('modal-enter-active');
                }, 10);
            }
            
            closeDeveloperModal() {
                const modal = document.getElementById('developerModal');
                modal.classList.remove('modal-enter-active');
                
                setTimeout(() => {
                    modal.classList.add('hidden');
                    document.body.classList.remove('modal-open');
                }, 300);
            }
            
            toggleMobileMenu() {
                // Add your mobile menu toggle logic here
                console.log('Mobile menu toggled');
                // You can implement a sidebar or dropdown menu here
            }
        }
        
        // Initialize the UI when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new SmartEvaluatorUI();
        });
    </script>
</body>
</html>
